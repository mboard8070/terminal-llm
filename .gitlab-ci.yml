workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - test
  - build
  - security
  - package
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  SECRET_DETECTION_HISTORIC_SCAN: "false"

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

python:lint:
  stage: validate
  image: python:3.12-slim
  cache:
    key: python-pip
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install ruff
  script:
    - ruff check .
  allow_failure: true

python:test:
  stage: test
  image: python:3.12-slim
  cache:
    key: python-pip
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
  script:
    - python -m pytest -q

phone:build:
  stage: build
  image: node:20-slim
  cache:
    key:
      files:
        - maude-phone/package-lock.json
    paths:
      - .cache/npm
  before_script:
    - cd maude-phone
    - npm ci
  script:
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - maude-phone/dist

client:package:
  stage: package
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - python -m pip install --upgrade pip
  script:
    - cd maude-client
    - python -m pip wheel --no-deps . -w dist
    - WHEEL="$(ls dist/*.whl)"
    - FILE="$(basename "$WHEEL")"
    - |
      python - "$WHEEL" "$FILE" <<'PY'
      import os
      import sys
      import urllib.request

      path, filename = sys.argv[1], sys.argv[2]
      project = os.environ["CI_PROJECT_ID"]
      tag = os.environ["CI_COMMIT_TAG"]
      token = os.environ["CI_JOB_TOKEN"]
      url = f"{os.environ['CI_API_V4_URL']}/projects/{project}/packages/generic/maude-client/{tag}/{filename}"

      with open(path, "rb") as fh:
          req = urllib.request.Request(url, data=fh.read(), method="PUT")
      req.add_header("JOB-TOKEN", token)
      req.add_header("Content-Type", "application/octet-stream")
      with urllib.request.urlopen(req) as resp:
          print(resp.status, resp.reason)
      PY
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - maude-client/dist/*.whl

phone:package:
  stage: package
  image: node:20-slim
  rules:
    - if: $CI_COMMIT_TAG
  cache:
    key:
      files:
        - maude-phone/package-lock.json
    paths:
      - .cache/npm
  before_script:
    - cd maude-phone
    - npm ci
  script:
    - npm run build
    - ARCHIVE="maude-phone-dist-${CI_COMMIT_TAG}.tar.gz"
    - tar -czf "$ARCHIVE" dist
    - |
      node - "$ARCHIVE" <<'JS'
      const fs = require("fs");
      const path = require("path");

      const archive = process.argv[2];
      const project = process.env.CI_PROJECT_ID;
      const tag = process.env.CI_COMMIT_TAG;
      const token = process.env.CI_JOB_TOKEN;
      const filename = path.basename(archive);
      const url = `${process.env.CI_API_V4_URL}/projects/${project}/packages/generic/maude-phone/${tag}/${filename}`;

      fetch(url, {
        method: "PUT",
        headers: {
          "JOB-TOKEN": token,
          "Content-Type": "application/octet-stream",
        },
        body: fs.readFileSync(archive),
      }).then(async (res) => {
        console.log(res.status, res.statusText);
        if (!res.ok) {
          console.error(await res.text());
          process.exit(1);
        }
      }).catch((err) => {
        console.error(err);
        process.exit(1);
      });
      JS
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - maude-phone/maude-phone-dist-*.tar.gz

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - client:package
    - phone:package
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    name: "MAUDE $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
